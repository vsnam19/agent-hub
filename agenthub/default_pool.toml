[defaults]
quota_cooldown = "60m"        # used when the agent does not say when quota resets
transient_cooldown = "3m"   # after a network failure (DNS, connection)
timeout = { implement = "60m", review = "20m", plan = "20m" }

[roles.implement-small]
kind = "implement"
escalate = "implement"
chain = ["gwen:qwen3.5-9b-4bit", "claude:haiku"]

[roles.implement]
kind = "implement"
escalate = "implement-hard"
chain = ["claude:haiku", "agy:claude-sonnet-5-5-medium", "agy:gemini-3.8-flash-high", "codex:gpt-5.6-terra"]

[roles.implement-hard]
kind = "implement"
chain = ["agy:gemini-4-argon-high", "codex:gpt-5.6-terra", "agy:claude-opus-5-5-high", "claude:sonnet"]

[roles.review]
kind = "review"
chain = ["agy:gemini-4-argon-medium", "codex:gpt-5.6-terra", "agy:gemini-3.8-flash-high", "claude:sonnet"]

[roles.techlead]
kind = "plan"
chain = ["claude:sonnet"]  # provisional until the bench (E7)
