# Suites of the gwen bench. Paths are relative to this file's directory.
# Gate argv placeholders: {python} (sys.executable), {build_dir} (fresh, outside the repository),
# {visible_tests} (as a whole argument: expands to the task's visible_tests).
# Harness placeholders from [<suite>.harness]: {lint_cmd}, {test_cmd} (empty when omitted).

[python]
fixture = "fixture"
tasks = "tasks"

[python.gate]
ruff = ["{python}", "-m", "ruff", "check", "--no-cache", "."]
visible = ["{python}", "-m", "pytest", "-q", "-p", "no:cacheprovider", "{visible_tests}"]
hidden = ["{python}", "-m", "pytest", "-q", "-p", "no:cacheprovider", "tests/hidden"]

[python.harness]
lint_cmd = "python: ruff check --fix"
test_cmd = "python -m pytest -q"

[cpp]
fixture = "cpp/fixture"
tasks = "cpp/tasks"

[cpp.gate]
configure = ["cmake", "-S", ".", "-B", "{build_dir}", "-G", "Ninja", "-DCMAKE_BUILD_TYPE=Debug"]
build = ["cmake", "--build", "{build_dir}"]
visible = ["ctest", "--test-dir", "{build_dir}", "-L", "visible", "--no-tests=error", "--output-on-failure"]
build-hidden = ["cmake", "--build", "{build_dir}", "--target", "minilib_hidden_tests"]
hidden =["ctest", "--test-dir", "{build_dir}", "-L", "hidden", "--no-tests=error", "--output-on-failure"]

[cpp.harness]
# aider appends the edited file name to lint_cmd, so the script ignores its argument.
lint_cmd = "sh -c 'cmake -S . -B build -G Ninja && cmake --build build' sh"
test_cmd = "sh -c 'cmake -S . -B build -G Ninja && cmake --build build && ctest --test-dir build --output-on-failure'"
